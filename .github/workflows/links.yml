name: links

# Skill repos move and get renamed. This catches a dead or moved link before a reader does.
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [README.md, index.html, CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, .github/workflows/links.yml]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --accept '200..=299,403,429'
            --exclude 'mvoshell652\.github\.io'
            --exclude 'security/advisories/new'
            README.md index.html CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
